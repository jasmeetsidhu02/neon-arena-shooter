<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/neon-arena-shooter/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Neon Arena — Three.js Shooter</title>
    <script type="module" crossorigin src="/neon-arena-shooter/assets/index-DIwjBOPV.js"></script>
    <link rel="stylesheet" crossorigin href="/neon-arena-shooter/assets/index-BKIhoJrI.css">
  </head>
  <body>
    <div id="hud">
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Wave</span><span id="wave">1</span></div>
      <div class="stat"><span class="label">Ammo</span><span id="ammo">12</span></div>
      <div class="health">
        <span class="label">Health</span>
        <div class="bar"><div id="health-fill"></div></div>
      </div>
    </div>

    <div id="crosshair"></div>
    <div id="damage"></div>
    <div id="banner"></div>

    <!-- Touch controls (shown only on touch devices) -->
    <div id="touch-ui">
      <div id="look-zone"></div>
      <div id="move-zone"></div>
      <div id="joystick"><div id="joystick-knob"></div></div>
      <button id="btn-fire" aria-label="Fire">FIRE</button>
      <button id="btn-reload" aria-label="Reload">R</button>
      <button id="btn-pause" aria-label="Pause">II</button>
    </div>

    <div id="overlay">
      <div class="panel">
        <h1>NEON ARENA</h1>
        <p id="subtitle">Survive the drone waves.</p>
        <button id="start">Click to Play</button>
        <ul class="controls desktop-only">
          <li><b>WASD</b> move</li>
          <li><b>Mouse</b> aim</li>
          <li><b>Click</b> shoot</li>
          <li><b>R</b> reload</li>
          <li><b>Shift</b> sprint</li>
          <li><b>Esc</b> pause</li>
        </ul>
        <ul class="controls touch-only">
          <li><b>Left thumb</b> move</li>
          <li><b>Right thumb</b> aim</li>
          <li><b>FIRE</b> shoot (drag to aim)</li>
          <li><b>R</b> reload</li>
        </ul>
        <p class="touch-only hint">Tip: turn your phone sideways for the best view.</p>
      </div>
    </div>

  </body>
</html>
